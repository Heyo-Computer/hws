# Validation only: no merge, artifact publication, or regional deployment.
name: regional-drain-validation

on:
  submit:
    paths:
      - 'app-lb/src/**'
      - 'orchestrator/src/handlers/regional*.rs'
      - '.ci/workflows/regional-drain-validation.yml'

jobs:
  drain-contract:
    vm:
      driver: firecracker
      build:
        dockerfile: .ci/image/apps/Dockerfile
        context: .ci/image/apps
        size_mb: 10240
      size_class: large
      disk_size_gb: 30
      ttl_seconds: 10800
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: never
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    timeout-minutes: 150
    steps:
      - name: Start isolated PostgreSQL
        timeout-minutes: 10
        run: |
          set -eu
          test "$(stat -c %d "$CARGO_TARGET_DIR")" != "$(stat -c %d /)"
          pg_ctlcluster 16 main status >/dev/null 2>&1 || pg_ctlcluster -o '-c listen_addresses=127.0.0.1' 16 main start
          runuser -u postgres -- psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres PASSWORD 'disposable-test-password'"

      - name: Test app-lb request control and build protocol binary
        working-directory: /workspace/app-lb
        timeout-minutes: 60
        run: |
          set -eu
          export HEYO_BUILD_GIT_SHA='${{ ci.sha }}'
          cargo test --locked --bin app-lb
          cargo build --locked --bin app-lb --features reqwest/rustls-tls-native-roots

      - name: Verify real gateway drain and stale-authority rejection
        working-directory: /workspace/orchestrator
        timeout-minutes: 75
        run: |
          set -eu
          export HEYO_BUILD_GIT_SHA='${{ ci.sha }}'
          export APP_LB_TEST_BINARY="$CARGO_TARGET_DIR/debug/app-lb"
          export ORCHESTRATOR_TEST_DATABASE_URL=postgres://postgres:disposable-test-password@127.0.0.1/postgres
          cargo test --locked --bin orchestrator handlers::regional_integration_tests::two_real_gateways_drain_through_authenticated_durable_barriers -- --ignored --exact

<!doctype html>
<html lang="en" {{HTML_ATTRS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}}</title>
<link rel="stylesheet" href="/__ui/heyo.css">
<script defer src="/__ui/theme.js"></script>
<style>
  /* ------------------------------------------------------------------------
     app-lb, layered on ui/heyo.css — the same sheet ci, app-obs, heyosecret and
     artifacts serve, so the five read as one product.

     **These names are aliases, not a second palette.** These pages were written
     against `--surface`/`--plane`/`--text-2`; each now resolves to a shared
     token rather than being renamed at several hundred call sites. `var()`
     resolves at use time, so switching the theme still switches everything —
     and there is one place to look when a colour is wrong.

     `--series-1..3`, `--grid` and `--axis` are *not* aliased: they are shared
     tokens under the same names, chosen for colour-vision separation and
     validated against both grounds. Do not retint them to match the accent.
     ------------------------------------------------------------------------ */
  :root {
    --plane: var(--bg-dark);
    --surface: var(--bg-panel);
    --text: var(--text-primary);
    --text-2: var(--text-secondary);
    --muted: var(--text-muted);
    --border: var(--border-color);
    --good: var(--success);
    --success-text: var(--success);
  }

  /* Section headings, table headers and small labels take the display face,
     which is most of what makes a page read as part of this system. */
  .section-title, thead th, table th, .tile .label, .k {
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* The same tokens as the dashboard, so the two read as one system. Kept as a
     copy rather than a shared file because both pages are `include_str!`d into
     the binary and there is no build step to share anything through. */

  * { box-sizing: border-box; }
  /* Ground, colour and the IBM Plex Mono stack come from the shared
     sheet; only this page's own padding is left. A local `font:` here
     would put one app back on a system sans while the other four kept
     the product face. */
  body { padding: 32px 24px 64px; }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .lede { color: var(--text-2); margin: 0 0 28px; }
  .links { margin-left: auto; display: flex; gap: 14px; align-items: baseline; }
  .links a {
    color: var(--text-2); text-decoration: none; font-size: 13px;
    border: 0; background: none; padding: 0; cursor: pointer; font-family: inherit;
  }
  .links a:hover { color: var(--text); text-decoration: underline; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

  /* The whole card is the link: this page exists to be clicked. */
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0; padding: 16px 18px;
    transition: border-color .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.07);
  }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .id { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    color: var(--accent); overflow-wrap: anywhere; margin-bottom: 10px;
  }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }

  .tag { font-size: 10px; padding: 1px 6px; border-radius: 0; flex: none; }
  /* The kind badge is the last chip on the row, so it takes the slack. A
     `sign-in` badge sits between it and the id. */
  .tag.vm     { margin-left: auto; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .tag.static { margin-left: auto; background: color-mix(in srgb, var(--muted) 22%, transparent); color: var(--text-2); }
  .tag.site   { margin-left: auto; background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--success-text); }
  .tag.gated  { margin-left: auto; background: color-mix(in srgb, var(--warning) 26%, transparent); color: var(--text-2); }
  /* When both are present the kind badge must not also claim the slack, or the
     two chips separate and the row reads as two groups. */
  .tag.gated + .tag { margin-left: 0; }

  .dot { width: 7px; height: 7px; border-radius: 0; flex: none; background: var(--muted); }
  .dot.ready { background: var(--good); }
  .dot.starting { background: var(--warning); }
  .dot.down { background: var(--critical); }

  .empty {
    border: 1px dashed var(--grid); border-radius: 0;
    padding: 28px; text-align: center; color: var(--text-2);
  }
  .note { margin-top: 26px; color: var(--muted); font-size: 12.5px; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    background: color-mix(in srgb, var(--muted) 16%, transparent);
    padding: 1px 5px; border-radius: 0;
  }
</style>
<!-- The theme used to be read from localStorage by a blocking script here.
     It is now stamped on <html> by the server from a cookie, which is both
     flash-free and shared across the fleet — localStorage is per-origin, so
     the choice did not survive a hop to ci or app-obs. See ui/theme.js. -->
</head>
<body>
<div class="wrap">
<header class="topbar">
    <a class="topbar-brand" href="/"><span>heyo</span><span class="topbar-app">{{APP_NAME}}</span></a>
    <button class="topbar-toggle" type="button" aria-expanded="false" aria-controls="topbar-nav" aria-label="Toggle navigation"><span class="bars"><span></span></span></button>
    <nav class="topbar-nav" id="topbar-nav">
      <a href="/" aria-current="page">Directory</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/siem">Security</a>
      <a href="/storage">Disks</a>
      <a href="/plugins">Plugins</a>
      <a href="/network">Network</a>
      <a href="/metrics">Metrics</a>
    </nav>
    <div class="topbar-right">
      <span class="topbar-user">{{WHO}}</span>
      <button class="theme-toggle" type="button" data-theme-toggle><span data-theme-label>theme</span></button>
    </div>
  </header>
  <p class="lede">{{LEDE}}</p>
  {{CARDS}}
</div>
<!-- No script of this page's own: everything above is rendered by the server,
     and the theme toggle is the shared one at /__ui/theme.js — a cookie scoped
     to the parent domain, so the choice follows a person to every Heyo app
     rather than stopping at this origin. -->
<script>
// Hamburger menu: collapse the nav on narrow screens. The open/closed state
// lives on the nav (`.open`) and is mirrored to the button's `aria-expanded`
// so assistive tech reads it correctly. Clicking a link or escaping closes it.
(function () {
  var btn = document.querySelector(".topbar-toggle");
  var nav = document.querySelector(".topbar-nav");
  if (!btn || !nav) return;
  var close = function () { nav.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); };
  btn.addEventListener("click", function () {
    var open = nav.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
  });
  nav.addEventListener("click", function (e) { if (e.target.closest("a")) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
})();

// A caller inside a namespace wall: the fleet's Disks and Plugins pages
// refuse it, so Disks goes and Plugins leads to its namespace's console.
(function () {
  fetch("/whoami", { headers: { accept: "application/json" }, cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (who) {
      if (!who || who.fleet) return;
      var pinned = new URLSearchParams(location.search).get("namespace");
      var granted = Object.keys(who.namespaces || {});
      var ns = pinned || who.namespace || (granted.length === 1 ? granted[0] : "");
      document.querySelectorAll('.topbar-nav a[href="/storage"]').forEach(function (a) { a.hidden = true; });
      document.querySelectorAll('.topbar-nav a[href="/plugins"]').forEach(function (a) {
        if (ns) a.href = "/namespaces/" + encodeURIComponent(ns) + "/plugin-console";
        else a.hidden = true;
      });
    })
    .catch(function () {});
})();
</script>
</body>
</html>

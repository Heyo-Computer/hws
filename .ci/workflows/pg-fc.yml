name: pg-fc

on:
  submit:
    paths:
      - 'pg-fc/**'
      - 'ui/**'
      - '.ci/workflows/pg-fc.yml'
      - '.ci/rust-cache.sh'
      - '.ci/workflows/regional-release.yml'
      - '.ci/image/ci/**'

jobs:
  release:
    vm:
      driver: firecracker
      build:
        dockerfile: .ci/image/ci/Dockerfile
        context: .ci/image/ci
        size_mb: 6144
      size_class: large
      disk_size_gb: 20
      ttl_seconds: 5400
      cache_key_files:
        - pg-fc/Cargo.lock
        - pg-fc/Cargo.toml
        - pg-fc/rust-toolchain.toml
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '4'
    timeout-minutes: 90
    steps:
      - name: Check persistent build cache
        run: |
          set -eu
          test "$(stat -c %d "$CARGO_TARGET_DIR")" != "$(stat -c %d /)"
          df -P "$CARGO_TARGET_DIR" /

      - name: Test and build pg-fc
        working-directory: /workspace/pg-fc
        timeout-minutes: 75
        env: &rust_cache_env
          CI_RUST_CACHE_MODE: ${{ vars.CI_RUST_CACHE_MODE }}
          SCCACHE_BUCKET: ${{ vars.CI_RUST_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ vars.CI_RUST_CACHE_ENDPOINT }}
          SCCACHE_REGION: ${{ vars.CI_RUST_CACHE_REGION }}
          SCCACHE_S3_KEY_PREFIX: ${{ vars.CI_RUST_CACHE_PREFIX }}
          CI_RUST_CACHE_ACCESS_KEY_ID: ${{ secrets.CI_RUST_CACHE_ACCESS_KEY_ID }}
          CI_RUST_CACHE_SECRET_ACCESS_KEY: ${{ secrets.CI_RUST_CACHE_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          python3 -m unittest discover -s deploy -p 'test_sync_traefik_cert.py' -v
          python3 -m unittest discover -s deploy -p 'test_pooler_rollout.py' -v
          sh -n init.sh
          sh -n physical.sh
          python3 -m py_compile deploy/test_physical_seed.py
          sh /workspace/.ci/rust-cache.sh cargo test --locked --workspace
          sh /workspace/.ci/rust-cache.sh cargo build --release --locked --bin pg-vm-pool
          mkdir -p /workspace/dist
          mkdir -p /workspace/dist/guest
          cp Dockerfile init.sh physical.sh /workspace/dist/guest/
          cp "$CARGO_TARGET_DIR/release/pg-vm-pool" /workspace/dist/pg-vm-pool
          strip /workspace/dist/pg-vm-pool
          printf 'commit %s\nbranch %s\nrun %s\n' '${{ ci.sha }}' '${{ ci.branch }}' '${{ ci.run_id }}' > /workspace/dist/BUILD-INFO
          (cd /workspace/dist && sha256sum pg-vm-pool BUILD-INFO guest/Dockerfile guest/init.sh guest/physical.sh > SHA256SUMS)

      - uses: ci/upload-artifact
        with:
          name: pg-fc
          description: PostgreSQL Firecracker pooler host binary, including peer replication APIs and build provenance.
          path: dist

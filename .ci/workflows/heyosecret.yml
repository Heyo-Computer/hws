# Build the `heyosecret` release binary — the secret store every Heyo service
# reads its credentials from — and upload it, with its migrations and its
# supervisor unit, for `.ci/install.sh` and `.ci/install-apps.sh` to install.
#
# Submitted from the repository root, with an ordinary bundle:
#
#     git submit --only heyosecret
#
# Modeled on `queue.yml`; the comments there explain the image, the cache disk
# and the in-guest timeout, and are not repeated here.
name: heyosecret

on:
  submit:
    paths:
      - 'heyosecret/**'
      # `src/main.rs` includes `ui/ui.rs` with `#[path]`, which embeds the shared
      # stylesheet, theme script and fonts — a real input the lockfile cannot see.
      - 'ui/**'
      - '.ci/workflows/heyosecret.yml'
      - '.ci/image/apps/**'

jobs:
  release:
    uses: default
    vm:
      driver: firecracker
      build:
        dockerfile: .ci/image/apps/Dockerfile
        context: .ci/image/apps
        # Must equal the other `.ci/image/apps` workflows exactly: the image is
        # named by a hash of these three fields.
        size_mb: 10240
      # sqlx with rustls reaches aws-lc-sys, the same C build `queue` compiles
      # on `large`. There is no swap in a microVM, so a wrong guess downward is
      # an OOM kill, not a slow build.
      size_class: large
      disk_size_gb: 20
      cache_key_files:
        - heyosecret/Cargo.lock
        - heyosecret/rust-toolchain.toml
    env:
      CARGO_TERM_COLOR: never
    timeout-minutes: 45
    steps:
      - name: Guard the cache disk
        run: |
          df -P "$CARGO_TARGET_DIR" /
          if [ "$(stat -c %d "$CARGO_TARGET_DIR")" = "$(stat -c %d /)" ]; then
            echo "FATAL: $CARGO_TARGET_DIR is on the rootfs — the data disk (/dev/vdb) is not attached." >&2
            exit 1
          fi
          usage=$(df -P "$CARGO_TARGET_DIR" | awk 'NR==2 {gsub(/%/,""); print $5}')
          if [ -n "$usage" ] && [ "$usage" -ge 85 ]; then
            echo "cache disk at ${usage}%, wiping $CARGO_TARGET_DIR"
            rm -rf "$CARGO_TARGET_DIR"
          fi

      - name: Fetch dependencies
        working-directory: /workspace/heyosecret
        run: |
          cargo fetch --locked || { echo "fetch failed; retrying once"; sleep 10; cargo fetch --locked; }
        timeout-minutes: 10

      # Unit tests only. The crate's Dockerfile runs the same `cargo test
      # --locked` before its release build, so this keeps CI no weaker than the
      # image path it replaces.
      - name: Test
        working-directory: /workspace/heyosecret
        run: |
          log="$CARGO_TARGET_DIR/heyosecret-test.log"
          rc=0
          timeout -k 60 1200 cargo test --locked > "$log" 2>&1 || rc=$?
          tail -40 "$log"
          exit "$rc"
        timeout-minutes: 25

      - name: Build
        working-directory: /workspace/heyosecret
        run: |
          log="$CARGO_TARGET_DIR/heyosecret-build.log"
          rc=0
          timeout -k 60 1800 env CARGO_TERM_PROGRESS_WHEN=never \
            cargo build --release --locked --bins > "$log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            [ "$rc" -eq 124 ] && echo "=== the in-guest timeout killed the build after 1800s ==="
            echo "=== build failed (exit $rc); last 100 log lines ==="
            tail -100 "$log" 2>/dev/null || echo "(no log at $log)"
            dmesg | tail -50 || true
            exit 1
          fi
          tail -5 "$log"
        timeout-minutes: 35

      # There is no database in the guest, and heyosecret refuses to start
      # without one — which is exactly the property worth checking: it must exit
      # non-zero and name the missing setting rather than come up half-configured.
      - name: Smoke-test the binary
        run: |
          set -eu
          bin="$CARGO_TARGET_DIR/release/heyosecret"
          [ -x "$bin" ] || { echo "FATAL: heyosecret was not built at $bin" >&2; exit 1; }
          if ldd "$bin" | grep 'not found'; then
            echo "FATAL: heyosecret has unresolved shared libraries (see above)" >&2
            exit 1
          fi
          rc=0
          out="$(cd /tmp && env -i PATH="$PATH" HEYOSECRET_CONFIG_PATH=/nonexistent timeout 20 "$bin" 2>&1)" || rc=$?
          [ "$rc" -ne 0 ] || { echo "FATAL: heyosecret started with no database configured" >&2; exit 1; }
          case "$out" in
            *DATABASE_URL*) echo "ok: refuses to start without DATABASE_URL" ;;
            *) echo "FATAL: unexpected startup failure: $out" >&2; exit 1 ;;
          esac

      - name: Collect the binary
        run: |
          set -eu
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/release/heyosecret" dist/heyosecret
          strip dist/heyosecret
          # Applied on every start (`resolve_migrations_dir`), so they ship with
          # the binary; `install.sh` puts them where the shipped unit's
          # HEYOSECRET_MIGRATIONS_DIR points.
          cp -R heyosecret/migrations dist/migrations
          cp heyosecret/deploy/supervisor/heyosecret.conf dist/
          cat > dist/start.sh <<'SH'
          #!/bin/sh
          set -eu
          CDPATH= cd -- "$(dirname -- "$0")"
          export HEYOSECRET_MIGRATIONS_DIR="${HEYOSECRET_MIGRATIONS_DIR:-$PWD/migrations}"
          export HEYOSECRET_REVISION="${HEYOSECRET_REVISION:-$(cat ./REVISION)}"
          exec ./heyosecret
          SH
          chmod +x dist/start.sh
          printf '%s\n' '${{ ci.sha }}' > dist/REVISION
          version="$(awk -F'"' '/^version = /{print $2; exit}' heyosecret/Cargo.toml)"
          describe="$(git -C /workspace describe --tags --always --dirty 2>/dev/null || echo 'no-git')"
          cat > dist/BUILD-INFO <<EOF
          version   $version
          describe  $describe
          commit    ${{ ci.sha }}
          branch    ${{ ci.branch }}
          run       ${{ ci.run_id }}
          EOF
          ( cd dist && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS )
          ls -la dist
          cat dist/BUILD-INFO

      # Tagged `ci-heyosecret-<run>-release-heyosecret`.
      - uses: ci/upload-artifact
        with:
          name: heyosecret
          description: >-
            HeyoSecret, release binary for x86_64-linux, with migrations/, the
            supervisor unit and SHA256SUMS. Built from ${{ ci.branch }}.
          path: dist
          public: true

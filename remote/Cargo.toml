[package]
name = "remote"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "remote"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
# The repo's S3 signer is hand-rolled (see `src/sigv4.rs`) rather than the
# aws-sdk crate tree, as pg-fc and artifacts do.
hmac = "0.12"
md-5 = "0.10"
heyosecret-client = { path = "../heyosecret-client" }
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util", "io-std", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
maud = "0.27"
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

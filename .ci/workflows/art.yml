# Build the `art` release binary — the artifact store's CLI and server — and
# upload it as an artifact, so a host can install it from the store.
#
# Submitted from the repository root with `git submit`. `.git` exists in the
# guest, so the version stamp below is a real `git describe`, and the `paths:`
# filter below actually filters: a commit touching only `app-lb/` starts no run
# here at all.
#
# ## Why this exists
#
# `art` runs in two places, and only one of them was built by anything:
#
#  - **In the `artifacts` VM**, as `art serve` — the store behind
#    `art.us2.heyo.work`. That image is built by app-lb from
#    `artifacts/Dockerfile`, and this workflow has nothing to do with it.
#  - **On the app-lb host**, as a CLI. A deployment whose `vm.workspace.store`
#    is a *local path* is restored, captured and materialized by app-lb running
#    `art --root <store> --json stat|get|put …` (`app-lb/src/workspace.rs`),
#    found through `APP_LB_ART_BIN`. Nothing shipped that binary, and on
#    2026-08-30 the `artifacts` deployment sat at `Ready 0 / desired 1` with
#    "workspace restore pending: could not run art: No such file or directory"
#    — the store's own pool could not start because the host had no `art`.
#
# This workflow is the second one. `.ci/install.sh art` puts the result at
# `/usr/local/bin/art`, which is what `APP_LB_ART_BIN` should name.
#
# ## The image
#
# `artifacts` is 131 registry crates with no system library in its graph — no
# `openssl-src`, no `aws-lc-sys`, no `cmake` — so `build-essential` and `git`
# are all it needs, and that is exactly what `.ci/image/rust/` is. The image is
# named by a hash of its inputs, so a workflow that later shares it must keep
# every field under `vm.build` equal to this one's: one runner builds it once
# and both workflows reuse it.
name: art

on:
  submit:
    paths:
      # The crate.
      - 'artifacts/**'
      # Not a cargo dependency, but compiled in: `artifacts/src/lib.rs`
      # includes `../../ui/ui.rs` by `#[path]`, and that file `include_str!`s
      # the CSS, JS and fonts beside it. A change there is a change to this
      # binary that the lockfile cannot see.
      - 'ui/**'
      # This workflow and the image it builds in — named precisely rather than
      # as `.ci/**`, so adding a workflow for another crate does not rebuild
      # this one.
      - '.ci/workflows/art.yml'
      - '.ci/rust-cache.sh'
      - '.ci/image/rust/**'

jobs:
  release:
    # Any online host in the network the repository is assigned on /repos.
    # Deliberately not pinned: nothing here needs a particular machine, and a
    # small build should take the first free runner rather than idle behind one
    # host's queue. Add `uses: <network>/<node>` if a specific runner is wanted.
    vm:
      driver: firecracker
      build:
        dockerfile: .ci/image/rust/Dockerfile
        context: .ci/image/rust
        # 6 GB, the same as the `ci` image and for the same reason: what fills
        # a rootfs is the Rust toolchain (~1 GB) plus a CARGO_HOME registry
        # that grows at runtime. Shrinking it buys nothing but a narrower
        # margin against the SIGBUS that a full rootfs produces.
        size_mb: 6144
      # `medium` (2 CPU, 4 GB). axum, tokio and clap; nothing in this graph
      # generates code the way arrow does, and the whole build is a few
      # minutes cold. Picked on memory, as `.ci/README.md` says to.
      size_class: medium
      # Mounted at /var/cache/ci by the image's init, where CARGO_TARGET_DIR
      # points. 10 GB is many reuses of a target dir this size before the 85%
      # guard below wipes it.
      disk_size_gb: 10
      # The lockfile, plus the toolchain file the crate does not have — a
      # missing file hashes to an explicit marker, so adding one later busts
      # the pool at the moment it most needs busting. `ui/` is not here: a
      # change to it is a source change the incremental build picks up, not a
      # change to what the warm VM's cache was resolved against.
      cache_key_files:
        - artifacts/Cargo.lock
        - artifacts/rust-toolchain.toml
    env:
      CARGO_TERM_COLOR: never
    timeout-minutes: 45
    steps:
      # The image's init runs the same guard, but only at boot — a warm VM
      # serves many runs between boots, and the disk fills *while* warm.
      # Without this a pooled VM that crosses the threshold mid-lifetime fails
      # every build with SIGBUS (rustc writes its output through mmap) until
      # the VM happens to be retired. It also refuses to build without the
      # data disk at all, which names the actual problem in one line instead
      # of an unreadable SIGBUS mid-compile.
      - name: Guard the cache disk
        run: |
          df -P "$CARGO_TARGET_DIR" /
          if [ "$(stat -c %d "$CARGO_TARGET_DIR")" = "$(stat -c %d /)" ]; then
            echo "FATAL: $CARGO_TARGET_DIR is on the rootfs — the data disk (/dev/vdb) is not attached." >&2
            echo "Check disk creation on the runner host." >&2
            exit 1
          fi
          usage=$(df -P "$CARGO_TARGET_DIR" | awk 'NR==2 {gsub(/%/,""); print $5}')
          if [ -n "$usage" ] && [ "$usage" -ge 85 ]; then
            echo "cache disk at ${usage}%, wiping $CARGO_TARGET_DIR"
            rm -rf "$CARGO_TARGET_DIR"
          fi

      - name: Build
        # Absolute — `ci` renders `working-directory:` verbatim as
        # `cd <value> && …` rather than joining it onto /workspace, so a
        # relative value resolves from the login shell's home directory.
        working-directory: /workspace/artifacts
        # `--locked`, because the VM is fingerprinted on `Cargo.lock`.
        # `--bin art` rather than a bare `--release`: the crate is a lib plus
        # this one bin, and only the bin ships. Default features, which is
        # `daemon`: the host CLI does not serve HTTP, but one binary that can
        # do both is one artifact to track, and the server half is small.
        #
        # On failure, the guest kernel's ring buffer is what tells an OOM
        # kill, a block-layer I/O error, a full disk and a host-injected SIGBUS
        # apart — rustc dying on a signal looks identical from the outside in
        # every case. Printing it is safe: step output rides the exec channel,
        # not the serial console that carries the marker protocol.
        env: &rust_cache_env
          CI_RUST_CACHE_MODE: ${{ vars.CI_RUST_CACHE_MODE }}
          SCCACHE_BUCKET: ${{ vars.CI_RUST_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ vars.CI_RUST_CACHE_ENDPOINT }}
          SCCACHE_REGION: ${{ vars.CI_RUST_CACHE_REGION }}
          SCCACHE_S3_KEY_PREFIX: ${{ vars.CI_RUST_CACHE_PREFIX }}
          CI_RUST_CACHE_ACCESS_KEY_ID: ${{ secrets.CI_RUST_CACHE_ACCESS_KEY_ID }}
          CI_RUST_CACHE_SECRET_ACCESS_KEY: ${{ secrets.CI_RUST_CACHE_SECRET_ACCESS_KEY }}
        run: |
          cargo fetch --locked
          df -P / "$CARGO_TARGET_DIR"
          if ! sh /workspace/.ci/rust-cache.sh cargo build --release --locked --bin art; then
            echo "=== build failed; guest kernel log tail ==="
            dmesg | tail -100 || true
            df -P / "$CARGO_TARGET_DIR"
            exit 1
          fi

      # Not just `--version`. The binary's job on a host is to be driven by
      # app-lb as a subprocess with an exact contract — `put … --tag` printing
      # a `digest`, `stat <tag>` printing the same one, `get <digest> -o …
      # --writable` producing the bytes, and `stat` of a tag that does not
      # exist failing with "not found" in its message (which is what
      # `workspace.rs` matches to mean "nothing to restore yet, boot empty").
      # Each of those is checked here against a throwaway store, so a change
      # to the CLI that would strand every local-store workspace fails this
      # build instead of the next restore.
      - name: Smoke-test the binary
        run: |
          set -eu
          bin="$CARGO_TARGET_DIR/release/art"
          [ -x "$bin" ] || { echo "FATAL: art was not built at $bin" >&2; exit 1; }
          "$bin" --version
          "$bin" --help > /dev/null
          root="/tmp/art-smoke-$$"
          rm -rf "$root"; mkdir -p "$root"
          printf 'hello from ci %s\n' "${{ ci.run_id }}" > "$root.in"
          # The JSON is pretty-printed, hence the optional space after the colon.
          digest="$("$bin" --root "$root" --json put "$root.in" --tag smoke | grep -oE '"digest": *"[0-9a-f]{64}"' | head -1 | grep -oE '[0-9a-f]{64}')"
          [ -n "$digest" ] || { echo "FATAL: art put printed no digest" >&2; exit 1; }
          echo "ok: put stored $digest"
          "$bin" --root "$root" --json stat smoke | grep -q "\"digest\": *\"$digest\"" \
            || { echo "FATAL: art stat smoke did not resolve to $digest" >&2; exit 1; }
          echo "ok: stat resolves the tag"
          "$bin" --root "$root" --json get "$digest" -o "$root.out" --writable
          cmp "$root.in" "$root.out" || { echo "FATAL: art get returned different bytes" >&2; exit 1; }
          echo "ok: get round-trips the bytes"
          if out="$("$bin" --root "$root" --json stat no-such-tag 2>&1)"; then
            echo "FATAL: art stat of a missing tag succeeded: $out" >&2; exit 1
          fi
          case "$out" in
            *"not found"*) echo "ok: a missing tag fails with 'not found', as app-lb expects" ;;
            *) echo "FATAL: a missing tag failed without 'not found' in the message; app-lb's workspace restore would treat this as an error rather than an empty store: $out" >&2; exit 1 ;;
          esac
          rm -rf "$root" "$root.in" "$root.out"

      # Copied into the workspace because `ci/upload-artifact` tars its `path`
      # relative to /workspace and CARGO_TARGET_DIR is outside it; stripped
      # because this is a CLI people install, not one they debug from a core
      # dump.
      #
      # No supervisor unit: on a host `art` is a CLI app-lb calls, not a
      # service. `art serve` runs inside the `artifacts` VM image.
      - name: Collect the binary
        run: |
          set -eu
          mkdir -p dist
          src="$CARGO_TARGET_DIR/release/art"
          [ -f "$src" ] || { echo "FATAL: art was not built at $src" >&2; exit 1; }
          cp "$src" dist/art
          strip dist/art
          cat > dist/start.sh <<'SH'
          #!/bin/sh
          set -eu
          CDPATH= cd -- "$(dirname -- "$0")"
          export ART_REVISION="${ART_REVISION:-$(cat ./REVISION)}"
          exec ./art serve
          SH
          chmod +x dist/start.sh
          printf '%s\n' '${{ ci.sha }}' > dist/REVISION
          describe="$(git -C /workspace describe --tags --always --dirty 2>/dev/null || echo 'no-git')"
          cat > dist/BUILD-INFO <<EOF
          version   $(dist/art --version)
          describe  $describe
          commit    ${{ ci.sha }}
          branch    ${{ ci.branch }}
          run       ${{ ci.run_id }}
          EOF
          ( cd dist && sha256sum art start.sh REVISION BUILD-INFO > SHA256SUMS )
          ls -la dist
          cat dist/BUILD-INFO

      # Tagged `ci-art-<run>-release-art` in the store, which is what
      # `.ci/install.sh art` looks for. `description:` is set as a label on
      # the blob and the manifest rather than as a manifest annotation — a
      # manifest is addressed by its own hash, so editing that line would
      # otherwise fork the manifest for byte-identical builds.
      - uses: ci/upload-artifact
        with:
          name: art
          description: >-
            The art CLI — the artifact store's command line and server, a
            release binary for x86_64-linux, with SHA256SUMS. What
            APP_LB_ART_BIN names on an app-lb host. Built from ${{ ci.branch }}.
          path: dist
          # Fetchable by link with no ART_API_KEY once stored: the store marks
          # the tarball's blob public, and the step log and the run page carry
          # the `{store}/blobs/{digest}` URL. Download-only — the tag, the
          # manifest and the store's listings stay behind the key, so
          # `.ci/install.sh` (which resolves tags) still needs one; this is
          # for a host or a person that was handed the link.
          public: true

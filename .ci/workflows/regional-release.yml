# Activate only after both hosts expose the correlated rollout APIs and the
# controller supports these actions. Validation-only submissions do not run this
# coordinator. Tokens and host aliases are provisioned by the operator, never
# taken from a build artifact. NATS is an independent service and is not updated.
name: regional-release
on: release

jobs:
  merge:
    vm: &release_vm
      driver: firecracker
      build:
        dockerfile: .ci/image/ci/Dockerfile
        context: .ci/image/ci
        size_mb: 6144
      size_class: small
      disk_size_gb: 10
      ttl_seconds: 7200
    steps:
      - uses: ci/merge-release
        with:
          manifests: '[]'
          token: ${{ secrets.GIT_AUTH_TOKEN }}

  us3:
    needs: [merge]
    vm: *release_vm
    timeout-minutes: 60
    steps:
      - name: Verify us3 host app-lb replacement
        if: ${{ changed('app-lb/**', '.ci/workflows/app-lb.yml', '.ci/image/apps/**', '.ci/workflows/regional-release.yml') }}
        uses: ci/rollout-host-app-lb
        timeout-minutes: 20
        with:
          target: app-lb-us3
          token: ${{ secrets.APP_LB_US3_TOKEN }}
          workflow: .ci/workflows/app-lb.yml
          artifact: app-lb
      - name: Verify us3 orchestrator candidate and predecessor drain
        if: ${{ changed('orchestrator/**', 'heyosecret-client/**', 'app-lb/src/artifact.rs', 'app-lb/src/mounts.rs', 'app-lb/src/unpack.rs', '.ci/workflows/orchestrator.yml', '.ci/image/ci/**', '.ci/workflows/regional-release.yml') }}
        uses: ci/rollout-service
        timeout-minutes: 30
        with:
          url: https://admin.us3.heyo.work
          token: ${{ secrets.APP_LB_US3_TOKEN }}
          # Service identity stays fixed; rollouts create unique VM generations.
          deployment: orchestrator-us3
          namespace: default
          # Reuse the registered release mount and its private-store credential.
          mount-path: /opt/orchestrator-release
          revision-env: HEYO_ORCHESTRATOR_DEPLOYMENT_GIT_SHA
          workflow: .ci/workflows/orchestrator.yml
          artifact: orchestrator-linux

  eu1:
    needs: [us3]
    vm: *release_vm
    timeout-minutes: 60
    steps:
      - name: Verify eu1 host app-lb replacement
        if: ${{ changed('app-lb/**', '.ci/workflows/app-lb.yml', '.ci/image/apps/**', '.ci/workflows/regional-release.yml') }}
        uses: ci/rollout-host-app-lb
        timeout-minutes: 20
        with:
          target: app-lb-eu1
          token: ${{ secrets.APP_LB_EU1_TOKEN }}
          workflow: .ci/workflows/app-lb.yml
          artifact: app-lb
      - name: Verify eu1 orchestrator candidate and predecessor drain
        if: ${{ changed('orchestrator/**', 'heyosecret-client/**', 'app-lb/src/artifact.rs', 'app-lb/src/mounts.rs', 'app-lb/src/unpack.rs', '.ci/workflows/orchestrator.yml', '.ci/image/ci/**', '.ci/workflows/regional-release.yml') }}
        uses: ci/rollout-service
        timeout-minutes: 30
        with:
          url: https://admin.eu1.heyo.work
          token: ${{ secrets.APP_LB_EU1_TOKEN }}
          deployment: orchestrator-eu1
          namespace: default
          # Reuse the registered release mount and its private-store credential.
          mount-path: /opt/orchestrator-release
          revision-env: HEYO_ORCHESTRATOR_DEPLOYMENT_GIT_SHA
          workflow: .ci/workflows/orchestrator.yml
          artifact: orchestrator-linux

  # The US production fleet (us4 + us5), on its own branch of this graph: it
  # needs only `merge`, so a us3/eu1 failure does not hold production back and
  # a production failure does not hold up the two-region acceptance work.
  #
  # `hub` publishes the exact validated app-lb tarball as heyo/app-lb:<sha> and
  # moves heyo/app-lb:latest. The rollouts then install those same bytes:
  # each host downloads the blob by digest from the store it is mapped to
  # (art.us2, the global store hub.heyo.work serves), so what the hub lists is
  # what production runs.
  #
  # us4 and us5 share fleet state, so one app-lb token is valid on both and
  # both jobs use it (APP_LB_US_FLEET_TOKEN, a token scoped to the two
  # app-lb-admin-us* deployments). The targets `app-lb-us4` and `app-lb-us5`
  # live in the operator mapping (HeyoSecret ci-controller/host-app-lb-targets),
  # and each host carries the matching /etc/app-lb/host-update.json.
  #
  # The `changed()` lists match app-lb.yml's submit paths exactly, as the us3
  # and eu1 steps do, so a release never asks for a bundle that validation did
  # not build. A change to .ci/publish-hub.py alone therefore publishes nothing.
  hub:
    needs: [merge]
    vm: *release_vm
    timeout-minutes: 20
    steps:
      - uses: ci/checkout-release
        if: ${{ changed('app-lb/**', '.ci/workflows/app-lb.yml', '.ci/image/apps/**', '.ci/workflows/regional-release.yml') }}
      - uses: ci/download-artifact
        if: ${{ changed('app-lb/**', '.ci/workflows/app-lb.yml', '.ci/image/apps/**', '.ci/workflows/regional-release.yml') }}
        with:
          workflow: .ci/workflows/app-lb.yml
          name: app-lb
          path: app-lb-release.tar.gz
      - name: Publish app-lb to the hub
        if: ${{ changed('app-lb/**', '.ci/workflows/app-lb.yml', '.ci/image/apps/**', '.ci/workflows/regional-release.yml') }}
        env:
          ART_API_KEY: ${{ secrets.ART_API_KEY }}
          CI_RUN_ID: ${{ ci.run_id }}
        run: |
          set -eu
          python3 .ci/publish-hub.py app-lb-release.tar.gz \
            --store https://art.us2.heyo.work \
            --repo heyo/app-lb --name app-lb \
            --description "app-lb: the Heyo load balancer and deployment controller, plus heyctl (its CLI), with the supervisor config and SHA256SUMS."

  us4:
    needs: [hub]
    vm: *release_vm
    timeout-minutes: 30
    steps:
      - name: Verify us4 host app-lb replacement
        if: ${{ changed('app-lb/**', '.ci/workflows/app-lb.yml', '.ci/image/apps/**', '.ci/workflows/regional-release.yml') }}
        uses: ci/rollout-host-app-lb
        timeout-minutes: 20
        with:
          target: app-lb-us4
          token: ${{ secrets.APP_LB_US_FLEET_TOKEN }}
          workflow: .ci/workflows/app-lb.yml
          artifact: app-lb

  us5:
    needs: [us4]
    vm: *release_vm
    timeout-minutes: 30
    steps:
      - name: Verify us5 host app-lb replacement
        if: ${{ changed('app-lb/**', '.ci/workflows/app-lb.yml', '.ci/image/apps/**', '.ci/workflows/regional-release.yml') }}
        uses: ci/rollout-host-app-lb
        timeout-minutes: 20
        with:
          target: app-lb-us5
          token: ${{ secrets.APP_LB_US_FLEET_TOKEN }}
          workflow: .ci/workflows/app-lb.yml
          artifact: app-lb

  poolers:
    needs: [eu1]
    vm: *release_vm
    timeout-minutes: 60
    steps:
      - uses: ci/checkout-release
        if: ${{ changed('pg-fc/**', 'ui/**', '.ci/workflows/pg-fc.yml', '.ci/image/ci/**', '.ci/workflows/regional-release.yml') }}
      - uses: ci/download-artifact
        if: ${{ changed('pg-fc/**', 'ui/**', '.ci/workflows/pg-fc.yml', '.ci/image/ci/**', '.ci/workflows/regional-release.yml') }}
        with:
          workflow: .ci/workflows/pg-fc.yml
          name: pg-fc
          path: pg-fc-release.tar.gz
      - name: Replace poolers in operator-configured order
        if: ${{ changed('pg-fc/**', 'ui/**', '.ci/workflows/pg-fc.yml', '.ci/image/ci/**', '.ci/workflows/regional-release.yml') }}
        env:
          PG_FC_ROLLOUT_TARGETS: ${{ secrets.PG_FC_ROLLOUT_TARGETS }}
          APP_LB_US3_TOKEN: ${{ secrets.APP_LB_US3_TOKEN }}
          APP_LB_EU1_TOKEN: ${{ secrets.POOLER_APP_LB_EU1_TOKEN }}
          PG_FC_RUN_ID: ${{ ci.run_id }}
        run: |
          set -eu
          export PG_FC_REVISION="$(git rev-parse HEAD)"
          python3 pg-fc/deploy/rollout_poolers.py pg-fc-release.tar.gz

  # Last, after both branches: the validator requires controller replacement
  # to depend on every other release job.
  controller:
    needs: [poolers, us5]
    vm: *release_vm
    timeout-minutes: 30
    steps:
      - name: Replace CI only after both regional stages succeed
        if: ${{ changed('ci/**', 'app-lb/src/host_bundle.rs', 'pg-fc/deploy/replace_pooler.py', '.ci/workflows/ci.yml', '.ci/image/ci/**', '.ci/workflows/regional-release.yml') }}
        uses: ci/deploy-controller
        timeout-minutes: 25
        with:
          workflow: .ci/workflows/ci.yml
          artifact: ci

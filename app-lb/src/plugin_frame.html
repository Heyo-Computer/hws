<!doctype html>
<html lang="en" {{HTML_ATTRS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} · {{NAMESPACE}} · {{PLUGIN_NAME}}</title>
<!-- Read by the script rather than spliced into it: the server fills these
     escaped for HTML, which is not the same as escaped for JavaScript. -->
<meta name="plugin-namespace" content="{{NAMESPACE}}">
<meta name="plugin-id" content="{{PLUGIN_ID}}">
<link rel="stylesheet" href="/__ui/heyo.css">
<script defer src="/__ui/theme.js"></script>
<style>
  :root {
    --surface: var(--bg-panel);
    --text: var(--text-primary);
    --text-2: var(--text-secondary);
    --muted: var(--text-muted);
    --border: var(--border-color);
  }
  * { box-sizing: border-box; }
  /* The plugin's page fills everything under the bar: the frame is the page. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; }
  .chrome { padding: 16px 24px 0; flex: none; }
  .crumbs { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    font-size: 13px; color: var(--text-2); margin: 0 0 10px; }
  .crumbs .spacer { margin-left: auto; }
  main { flex: 1; min-height: 0; display: flex; border-top: 1px solid var(--border); }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg-dark); }
  .state { margin: 40px auto; max-width: 560px; text-align: center; color: var(--text-2); }
  .state p { margin: 0 0 14px; }
  button.act {
    font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 0; cursor: pointer;
    border: 1px solid var(--accent); background: var(--surface); color: var(--accent);
  }
  button.act:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="chrome">
<header class="topbar">
    <a class="topbar-brand" href="/"><span>heyo</span><span class="topbar-app">{{APP_NAME}}</span></a>
    <nav class="topbar-nav">
      <a href="/">Directory</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/siem">Security</a>
      <a href="/storage" data-fleet-only>Disks</a>
      <a href="/plugins" data-fleet-only>Plugins</a>
      <a href="/network">Network</a>
      <a href="/metrics">Metrics</a>
    </nav>
    <div class="topbar-right">
      <span class="topbar-user">{{WHO}}</span>
      <button class="theme-toggle" type="button" data-theme-toggle><span data-theme-label>theme</span></button>
    </div>
  </header>
  <div class="crumbs">
    <a href="/namespaces/{{NAMESPACE}}/plugin-console">← Plugins</a>
    <span>Namespace <strong>{{NAMESPACE}}</strong> · {{PLUGIN_NAME}}</span>
    <span id="tier"></span>
    <span class="spacer"></span>
    <a href="/dashboard?namespace={{NAMESPACE}}">Namespace dashboard</a>
    <a id="popout" href="#" target="_blank" rel="noopener" hidden>Open in a new tab ↗</a>
  </div>
</div>
<main id="main"><div class="state">Loading…</div></main>

<script>
"use strict";

const NS = document.querySelector('meta[name="plugin-namespace"]').content;
const ID = document.querySelector('meta[name="plugin-id"]').content;
const base = "/namespaces/" + encodeURIComponent(NS) + "/plugins/" + encodeURIComponent(ID);
const main = document.getElementById("main");

async function api(method, path, body) {
  const opts = { method, headers: { accept: "application/json" } };
  if (body !== undefined) {
    opts.headers["content-type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  try {
    const r = await fetch(path, opts);
    const text = await r.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = { message: text }; }
    return { ok: r.ok, status: r.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: { message: String(e) } };
  }
}

function say(message, button) {
  const box = document.createElement("div");
  box.className = "state";
  const p = document.createElement("p");
  p.textContent = message;
  box.appendChild(p);
  if (button) box.appendChild(button);
  main.replaceChildren(box);
}

async function render() {
  const who = await api("GET", "/whoami");
  const tier = !who.ok ? "none"
    : who.data.fleet ? "admin" : ((who.data.namespaces || {})[NS] || "none");
  if (who.ok && !who.data.fleet) document.querySelectorAll("[data-fleet-only]").forEach(a => a.hidden = true);
  document.getElementById("tier").textContent =
    tier === "admin" ? "· admin access" : tier === "none" ? "" : "· read-only access";

  const r = await api("GET", base);
  if (!r.ok) {
    const d = r.data || {};
    return say(r.status === 401 || r.status === 403
      ? "This session cannot reach namespace " + NS + "."
      : "Loading the plugin failed: " + (d.error || d.message || "HTTP " + r.status));
  }
  const p = r.data;
  if (!p.enabled) return say("The operator has not switched " + p.name + " on for this host.");
  if (!p.dashboard) return say(p.name + " has no dashboard.");
  if (!p.installed) {
    if (tier !== "admin") return say(p.name + " is not installed in " + NS + ". A namespace admin can install it.");
    const b = document.createElement("button");
    b.className = "act";
    b.type = "button";
    b.textContent = "Install " + p.name;
    b.addEventListener("click", async () => {
      b.disabled = true;
      const put = await api("PUT", base, {});
      if (!put.ok) {
        b.disabled = false;
        const d = put.data || {};
        return say("Installing failed: " + (d.error || d.message || "HTTP " + put.status), b);
      }
      render();
    });
    return say(p.name + " is not installed in " + NS + ".", b);
  }
  // Same origin, so the frame carries this session. The proxy only lets the
  // page be framed by app-lb and talk to app-lb.
  const src = base + "/" + p.dashboard;
  const frame = document.createElement("iframe");
  frame.title = p.name + " for " + NS;
  frame.src = src;
  main.replaceChildren(frame);
  const pop = document.getElementById("popout");
  pop.href = src;
  pop.hidden = false;
}

render();
</script>
</body>
</html>

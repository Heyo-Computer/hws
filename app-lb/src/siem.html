<!doctype html>
<html lang="en" {{HTML_ATTRS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} security</title>
<link rel="stylesheet" href="/__ui/heyo.css">
<script defer src="/__ui/theme.js"></script>
<style>
  /* ------------------------------------------------------------------------
     app-lb, layered on ui/heyo.css — the same sheet ci, app-obs, heyosecret and
     artifacts serve, so the five read as one product.

     **These names are aliases, not a second palette.** These pages were written
     against `--surface`/`--plane`/`--text-2`; each now resolves to a shared
     token rather than being renamed at several hundred call sites. `var()`
     resolves at use time, so switching the theme still switches everything —
     and there is one place to look when a colour is wrong.

     `--series-1..3`, `--grid` and `--axis` are *not* aliased: they are shared
     tokens under the same names, chosen for colour-vision separation and
     validated against both grounds. Do not retint them to match the accent.
     ------------------------------------------------------------------------ */
  :root {
    --plane: var(--bg-dark);
    --surface: var(--bg-panel);
    --text: var(--text-primary);
    --text-2: var(--text-secondary);
    --muted: var(--text-muted);
    --border: var(--border-color);
    --good: var(--success);
    --success-text: var(--success);
  }

  /* Section headings, table headers and small labels take the display face,
     which is most of what makes a page read as part of this system. */
  .section-title, thead th, table th, .tile .label, .k {
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* The dashboard's tokens. Copied rather than shared because both pages are
     `include_str!`d into the binary and there is no build step to share
     anything through. */

  * { box-sizing: border-box; }
  /* Ground, colour and the IBM Plex Mono stack come from the shared
     sheet; only this page's own padding is left. A local `font:` here
     would put one app back on a system sans while the other four kept
     the product face. */
  body { padding: 28px 24px 72px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .lede { color: var(--text-2); margin: 0 0 22px; }
  .links { margin-left: auto; display: flex; gap: 14px; align-items: baseline; }
  .links a {
    color: var(--text-2); text-decoration: none; font-size: 13px;
    border: 0; background: none; padding: 0; cursor: pointer; font-family: inherit;
  }
  .links a:hover { color: var(--text); text-decoration: underline; }

  .section-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 30px 0 10px; font-weight: 600;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0; padding: 16px 18px; margin-bottom: 12px;
  }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 0; padding: 14px 16px; }
  .tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tile .value { font-size: 24px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .value.attn { color: var(--critical); }
  .tile .sub { font-size: 12px; color: var(--text-2); margin-top: 3px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  select, input[type=text] {
    font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 0;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .filters .spacer { margin-left: auto; }

  button.act {
    font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 0; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  button.act:hover { border-color: var(--accent); }
  button.act.danger { color: var(--critical); }
  button.act.danger:hover { border-color: var(--critical); }
  button.act:disabled { opacity: .5; cursor: not-allowed; }

  .tag { font-size: 10px; padding: 1px 6px; border-radius: 0; flex: none; }
  .tag.critical { background: color-mix(in srgb, var(--critical) 26%, transparent); color: var(--critical); }
  .tag.high     { background: color-mix(in srgb, var(--critical) 20%, transparent); color: var(--critical); }
  .tag.medium   { background: color-mix(in srgb, var(--warning) 28%, transparent); color: var(--serious); }
  .tag.low      { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .tag.info     { background: color-mix(in srgb, var(--muted) 20%, transparent); color: var(--text-2); }
  .tag.block    { background: color-mix(in srgb, var(--critical) 20%, transparent); color: var(--critical); }
  .tag.allow    { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--success-text); }
  .tag.dry      { background: color-mix(in srgb, var(--warning) 26%, transparent); color: var(--serious); }

  .alert { border-bottom: 1px solid var(--grid); padding: 13px 0; }
  .alert:last-child { border-bottom: 0; padding-bottom: 0; }
  .alert:first-child { padding-top: 0; }
  .alert-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .alert-head .title { font-weight: 600; overflow-wrap: anywhere; }
  .alert-head .when { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .fact {
    font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 1px 6px; border-radius: 0; background: color-mix(in srgb, var(--muted) 16%, transparent);
    color: var(--text-2); overflow-wrap: anywhere;
  }
  details.respond { margin-top: 9px; }
  details.respond > summary {
    cursor: pointer; font-size: 12.5px; color: var(--accent); list-style: none;
    display: inline-flex; align-items: center; gap: 5px;
  }
  details.respond > summary::-webkit-details-marker { display: none; }
  details.respond > summary::before { content: "▸"; font-size: 10px; }
  details.respond[open] > summary::before { content: "▾"; }
  .respond-body {
    margin-top: 9px; padding: 12px 14px; border-radius: 0;
    background: var(--plane); border: 1px solid var(--border);
  }
  .respond-body h4 {
    margin: 0 0 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); font-weight: 600;
  }
  .respond-body ul { margin: 0 0 14px; padding-left: 18px; color: var(--text-2); font-size: 13px; }
  .respond-body li { margin-bottom: 4px; }
  .caveat {
    font-size: 12.5px; color: var(--text-2); margin-bottom: 14px; padding: 9px 11px;
    border-left: 3px solid var(--warning); border-radius: 0;
    background: color-mix(in srgb, var(--warning) 9%, transparent);
  }
  .action { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 9px; }
  .action .effect { font-size: 12px; color: var(--text-2); flex: 1 1 260px; }
  details.ecs > summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-top: 9px; }
  pre.ecs {
    margin: 8px 0 0; padding: 10px 12px; border-radius: 0; overflow: auto;
    background: var(--plane); border: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
    color: var(--text-2); max-height: 320px;
  }

  table.rules { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.rules th {
    text-align: left; color: var(--muted); font-weight: 500;
    padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap;
  }
  table.rules td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  table.rules tr:last-child td { border-bottom: 0; }
  table.rules td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.rules td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  /* Hit sparklines. `preserveAspectRatio="none"` lets one viewBox stretch to
     whatever the column is, so the bars stay aligned across rows. */
  .spark { display: block; width: 108px; height: 22px; }
  .spark rect { fill: var(--series-1); }
  .spark.idle rect { fill: var(--muted); }
  .spark-none {
    font-size: 11px; color: var(--muted); font-style: italic; white-space: nowrap;
  }
  .headline { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .headline .chart { flex: 1 1 320px; min-width: 240px; }
  .headline svg { display: block; width: 100%; height: 56px; }
  .headline .legend {
    display: flex; gap: 14px; font-size: 11.5px; color: var(--text-2); margin-top: 6px;
  }
  .headline .swatch {
    display: inline-block; width: 8px; height: 8px; border-radius: 0; margin-right: 5px;
  }

  select.ttl {
    font: inherit; font-size: 12px; padding: 3px 6px; border-radius: 0;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }

  .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .empty { color: var(--text-2); padding: 20px 0; text-align: center; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    background: color-mix(in srgb, var(--muted) 16%, transparent);
    padding: 1px 5px; border-radius: 0;
  }

  /* One line above the fold that reports what the last button press did. */
  .flash {
    position: sticky; top: 0; z-index: 5; margin: 0 0 14px;
    padding: 10px 14px; border-radius: 0; font-size: 13px; display: none;
  }
  .flash.on { display: block; }
  .flash.ok { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--success-text); }
  .flash.bad { background: color-mix(in srgb, var(--critical) 14%, var(--surface)); color: var(--critical); }
</style>
<!-- The theme used to be read from localStorage by a blocking script here.
     It is now stamped on <html> by the server from a cookie, which is both
     flash-free and shared across the fleet — localStorage is per-origin, so
     the choice did not survive a hop to ci or app-obs. See ui/theme.js. -->
</head>
<body>
<div class="wrap">
<header class="topbar">
    <a class="topbar-brand" href="/"><span>heyo</span><span class="topbar-app">{{APP_NAME}}</span></a>
    <button class="topbar-toggle" type="button" aria-expanded="false" aria-controls="topbar-nav" aria-label="Toggle navigation"><span class="bars"><span></span></span></button>
    <nav class="topbar-nav" id="topbar-nav">
      <a href="/">Directory</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/siem" aria-current="page">Security</a>
      <a href="/storage">Disks</a>
      <a href="/plugins">Plugins</a>
      <a href="/network">Network</a>
      <a href="/metrics">Metrics</a>
    </nav>
    <div class="topbar-right">
      <span class="topbar-user">{{WHO}}</span>
      <button class="theme-toggle" type="button" data-theme-toggle><span data-theme-label>theme</span></button>
    </div>
  </header>
  <p class="lede" id="lede">Loading…</p>

  <div class="flash" id="flash"></div>

  <div class="tiles" id="tiles"></div>

  <div class="section-title">Findings</div>
  <div class="filters">
    <select id="f-severity">
      <option value="">Any severity</option>
      <option value="critical">Critical</option>
      <option value="high">High and above</option>
      <option value="medium">Medium and above</option>
      <option value="low">Low and above</option>
    </select>
    <select id="f-rule"><option value="">Any rule</option></select>
    <!-- Populated from /namespaces, which narrows itself to what this
         credential can already see — so the options are never a list of rooms
         the reader cannot open. -->
    <select id="f-namespace"><option value="">Any namespace</option></select>
    <input type="text" id="f-deployment" placeholder="deployment" size="14">
    <span class="spacer"></span>
    <button class="act" id="refresh" type="button">Refresh</button>
    <label style="font-size:12.5px;color:var(--text-2)">
      <input type="checkbox" id="auto" checked> auto
    </label>
  </div>
  <div class="card" id="alerts"><div class="empty">Loading…</div></div>

  <div class="section-title">Rules in force</div>
  <div class="card" id="enforcement"></div>
  <div class="card" id="rules"><div class="empty">Loading…</div></div>
</div>

<script>
"use strict";
// A caller inside a namespace wall: the fleet's Disks and Plugins pages
// refuse it, so Disks goes and Plugins leads to its namespace's console.
(function () {
  fetch("/whoami", { headers: { accept: "application/json" }, cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (who) {
      if (!who || who.fleet) return;
      var pinned = new URLSearchParams(location.search).get("namespace");
      var granted = Object.keys(who.namespaces || {});
      var ns = pinned || who.namespace || (granted.length === 1 ? granted[0] : "");
      document.querySelectorAll('.topbar-nav a[href="/storage"]').forEach(function (a) { a.hidden = true; });
      document.querySelectorAll('.topbar-nav a[href="/plugins"]').forEach(function (a) {
        if (ns) a.href = "/namespaces/" + encodeURIComponent(ns) + "/plugin-console";
        else a.hidden = true;
      });
    })
    .catch(function () {});
})();

// Hamburger menu: collapse the nav on narrow screens. The open/closed state
// lives on the nav (`.open`) and is mirrored to the button's `aria-expanded`
// so assistive tech reads it correctly. Clicking a link or escaping closes it.
(function setupNavToggle() {
  var btn = document.querySelector(".topbar-toggle");
  var nav = document.querySelector(".topbar-nav");
  if (!btn || !nav) return;
  var close = function () { nav.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); };
  btn.addEventListener("click", function () {
    var open = nav.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
  });
  nav.addEventListener("click", function (e) { if (e.target.closest("a")) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
})();

// Every interpolation below goes through this. The strings on this page are
// attacker-shaped by definition — a path, a user agent, a query parameter name —
// and a missed escape here is a stored XSS in the security console itself.
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const $ = id => document.getElementById(id);
const fmt = n => (n == null ? "—" : Number(n).toLocaleString());

function ago(secs) {
  if (!secs) return "";
  const d = Math.max(0, Math.floor(Date.now() / 1000) - secs);
  if (d < 60) return d + "s ago";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  return Math.floor(d / 86400) + "d ago";
}
function until(secs) {
  if (!secs) return "never";
  const d = secs - Math.floor(Date.now() / 1000);
  if (d <= 0) return "expired";
  if (d < 3600) return "in " + Math.ceil(d / 60) + "m";
  if (d < 86400) return "in " + Math.round(d / 3600) + "h";
  return "in " + Math.round(d / 86400) + "d";
}

async function api(method, path, body) {
  const opts = { method, headers: { accept: "application/json" } };
  if (body !== undefined) {
    opts.headers["content-type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  try {
    const r = await fetch(path, opts);
    if (r.status === 204) return { ok: true, status: 204, data: null };
    const text = await r.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = { message: text }; }
    return { ok: r.ok, status: r.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: { message: String(e) } };
  }
}

function flash(kind, message) {
  const el = $("flash");
  el.className = "flash on " + kind;
  el.textContent = message;
  if (flash.timer) clearTimeout(flash.timer);
  // Long enough to read a sentence, and it stays put while the poll runs so a
  // refresh landing underneath cannot wipe the only record of what happened.
  flash.timer = setTimeout(() => { el.className = "flash"; }, 12000);
}

// Which alerts have their runbook open. Kept outside the markup because the
// poll rebuilds the list, and a disclosure that closes itself every ten seconds
// is unusable exactly when somebody is reading it.
const expanded = new Set();
let latest = null;

function tiles(d) {
  const s = d.stats || {};
  const g = d.guard || {};
  const urgent = (d.totals ? d.totals.high + d.totals.critical : 0);
  const sampling = s.dropped
    ? "queue dropping — detection is sampling"
    : s.clients_at_capacity ? "source table full" : "";
  const items = [
    ["Findings", fmt(d.alerts ? d.alerts.length : 0), urgent ? `${fmt(urgent)} high or critical` : "held in memory", urgent > 0],
    ["Sources tracked", fmt(s.tracked_clients), sampling, !!sampling],
    ["Rules in force", fmt(g.rules), g.enforcing === false ? "not enforcing — dry run" : "enforcing", g.enforcing === false],
    ["Requests refused", fmt(g.blocked), g.exempted ? `${fmt(g.exempted)} exempted` : "since start", false],
  ];
  $("tiles").innerHTML = items.map(([label, value, sub, attn]) =>
    `<div class="tile"><div class="label">${esc(label)}</div>
     <div class="value${attn ? " attn" : ""}">${esc(value)}</div>
     <div class="sub">${esc(sub)}</div></div>`).join("");
}

function renderAlerts(d) {
  const el = $("alerts");
  if (!d.enabled) {
    el.innerHTML = `<div class="empty">Detection is off (<code>APP_LB_SIEM=0</code>).
      Rules below are still enforced — blocking does not depend on detecting.</div>`;
    return;
  }
  const alerts = d.alerts || [];
  if (!alerts.length) {
    el.innerHTML = `<div class="empty">No findings. app-lb is watching authentication failures,
      attack signatures and traffic anomalies over a ${esc(d.window_secs)}s window.</div>`;
    return;
  }
  el.innerHTML = alerts.map(renderAlert).join("");
}

function renderAlert(a) {
  const r = a.response || {};
  const key = "alert-" + a.id;
  const open = expanded.has(a.id) ? " open" : "";

  const facts = [];
  if (a.client) facts.push(a.client);
  if (a.deployment) facts.push(a.deployment);
  if (a.path) facts.push(a.path);
  if (a.technique) facts.push("ATT&CK " + a.technique);
  if (a.count > 1) facts.push("×" + fmt(a.count));

  const investigate = (r.investigate || []).length
    ? `<h4>Check first</h4><ul>${r.investigate.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : "";
  const caveat = r.caveat ? `<div class="caveat">${esc(r.caveat)}</div>` : "";
  const actions = (r.actions || []).length
    ? `<h4>Act</h4>` + r.actions.map((act, i) => {
        // The runbook's suggested lifetime pre-selects, so the default stays
        // what the server recommended; the picker is what makes any other
        // choice — including forever — reachable without hand-writing a POST.
        const suggested = act.rule && act.rule.expires_in_secs != null
          ? act.rule.expires_in_secs : null;
        return `<div class="action">
           <button class="act${act.kind === "exempt-client" ? "" : " danger"}"
                   type="button" data-alert="${esc(a.id)}" data-action="${i}">${esc(act.label)}</button>
           ${ttlSelect(`data-for="${esc(a.id)}-${i}"`, suggested)}
           <span class="effect">${esc(act.effect)}</span>
         </div>`;
      }).join("")
    : `<div class="effect">No rule app-lb can apply for this one — see the notes above.</div>`;

  const ecs = a.ecs
    ? `<details class="ecs"><summary>Event fields (ECS)</summary>
       <pre class="ecs">${esc(JSON.stringify(a.ecs, null, 2))}</pre></details>` : "";

  return `<div class="alert" id="${esc(key)}">
    <div class="alert-head">
      <span class="tag ${esc(a.severity)}">${esc(a.severity)}</span>
      <span class="title">${esc(a.title)}</span>
      <span class="when">${esc(ago(Math.floor(a.last_ts / 1000)))}</span>
    </div>
    <div class="facts">${facts.map(f => `<span class="fact">${esc(f)}</span>`).join("")}
      <span class="fact">${esc(a.rule)}</span></div>
    <details class="respond"${open} data-alert="${esc(a.id)}">
      <summary>Respond</summary>
      <div class="respond-body">${investigate}${caveat}${actions}${ecs}</div>
    </details>
  </div>`;
}

// How long a rule lasts. "Forever" is last and deliberately not the default:
// the realistic failure here is not a missing block, it is a permanent one that
// outlives the attack and quietly breaks a customer weeks later.
const TTLS = [
  ["1 hour", 3600],
  ["24 hours", 86400],
  ["7 days", 604800],
  ["30 days", 2592000],
  ["Forever", null],
];

// `selected` pre-picks an option; `placeholder` instead leads with a neutral
// entry and selects nothing.
//
// The distinction matters. On an alert's action the value shown *is* the value
// that will be applied, so it must default to what the runbook suggested. In the
// rules table it is a change control sitting next to an "Expires" column that
// already states the truth — pre-selecting an arbitrary option there would claim
// a rule expiring in 22 hours is set to "1 hour".
function ttlSelect(name, selected, placeholder) {
  const head = placeholder ? `<option value="">${esc(placeholder)}</option>` : "";
  const opts = TTLS.map(([label, secs]) =>
    `<option value="${secs === null ? "never" : secs}"${
      !placeholder && secs === selected ? " selected" : ""}>${esc(label)}</option>`).join("");
  return `<select class="ttl" ${name}>${head}${opts}</select>`;
}

/// `null` = forever, `undefined` = nothing chosen.
const ttlValue = el =>
  el.value === "" ? undefined : el.value === "never" ? null : Number(el.value);

// A bar per bucket, scaled to the row's own peak. Per-row rather than a shared
// scale because the question each one answers is "is *this* rule still firing",
// not "which rule fires most" — a busy rule would otherwise flatten every other
// row to invisibility.
function sparkline(series, bucketSecs) {
  if (!Array.isArray(series) || !series.length) {
    return `<span class="spark-none">no data yet</span>`;
  }
  const max = Math.max(...series);
  const total = series.reduce((a, b) => a + b, 0);
  if (!total) {
    // An all-zero series is a finding, not an absence — say so rather than
    // drawing a flat line somebody has to squint at.
    return `<span class="spark-none">no hits</span>`;
  }
  const n = series.length;
  const w = 100 / n;
  const bars = series.map((v, i) => {
    const h = (v / max) * 20;
    return `<rect x="${(i * w).toFixed(2)}" y="${(21 - h).toFixed(2)}"
      width="${(w * 0.8).toFixed(2)}" height="${Math.max(h, v ? 0.8 : 0).toFixed(2)}"/>`;
  }).join("");
  const mins = Math.round((n * bucketSecs) / 60);
  return `<svg class="spark" viewBox="0 0 100 22" preserveAspectRatio="none"
    role="img" aria-label="${fmt(total)} hits over the last ${mins} minutes">${bars}</svg>`;
}

// The headline: is enforcement doing anything at all? A flat line with rules in
// force is the "paying for a branch on every request for nothing" case, which is
// the whole reason this chart exists.
function renderEnforcement(d) {
  const g = d.guard || {};
  const el = $("enforcement");
  const blocked = g.blocked_recent || [];
  const exempted = g.exempted_recent || [];
  if (!blocked.length) {
    el.style.display = "none";
    return;
  }
  el.style.display = "";
  const bucket = g.hits_bucket_secs || 60;
  const mins = Math.round((g.hits_window_secs || blocked.length * bucket) / 60);
  const max = Math.max(1, ...blocked, ...exempted);
  const n = blocked.length;
  const x = i => (i / Math.max(1, n - 1)) * 100;
  const y = v => 22 - (v / max) * 20;
  const poly = s => s.map((v, i) => `${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(" ");
  const totalBlocked = blocked.reduce((a, b) => a + b, 0);

  const verdict = !g.rules
    ? "No rules in force."
    : totalBlocked
      ? `${fmt(totalBlocked)} request${totalBlocked === 1 ? "" : "s"} refused in the last ${mins} minutes.`
      : `Nothing refused in the last ${mins} minutes — ${fmt(g.rules)} rule${
          g.rules === 1 ? " is" : "s are"} being checked on every request without matching anything.`;

  el.innerHTML = `<div class="headline">
    <div class="chart">
      <svg viewBox="0 0 100 24" preserveAspectRatio="none" role="img"
           aria-label="requests refused over the last ${mins} minutes">
        <line x1="0" y1="22" x2="100" y2="22" stroke="var(--grid)" stroke-width="0.4"/>
        <polyline points="${poly(blocked)}" fill="none" stroke="var(--critical)"
                  stroke-width="1.1" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        ${exempted.some(v => v) ? `<polyline points="${poly(exempted)}" fill="none"
                  stroke="var(--good)" stroke-width="1.1" stroke-linejoin="round"
                  vector-effect="non-scaling-stroke"/>` : ""}
      </svg>
      <div class="legend">
        <span><span class="swatch" style="background:var(--critical)"></span>refused</span>
        ${exempted.some(v => v)
          ? `<span><span class="swatch" style="background:var(--good)"></span>exempted</span>` : ""}
        <span style="margin-left:auto">last ${mins}m · peak ${fmt(max)}/${bucket}s</span>
      </div>
    </div>
    <div style="flex:1 1 240px">
      <div class="tile" style="border:0;padding:0">
        <div class="label">Enforcement</div>
        <div class="value${g.rules && !totalBlocked ? " attn" : ""}">${fmt(totalBlocked)}</div>
        <div class="sub">${esc(verdict)}</div>
      </div>
    </div>
  </div>`;
}

function renderRules(d) {
  const el = $("rules");
  const rules = d.rules || [];
  const bucket = (d.guard || {}).hits_bucket_secs || 60;
  if (!rules.length) {
    el.innerHTML = `<div class="empty">No rules. Nothing is being refused.</div>
      <div class="note">Rules come from the <b>Respond</b> buttons above, or from
      <code>POST /security/rules</code>. They are written to disk, so they survive a restart —
      and they are never applied to this admin API, so a rule cannot lock you out of this page.</div>`;
    return;
  }
  const rows = rules.map(r => `<tr>
    <td><span class="tag ${esc(r.action)}">${esc(r.action)}</span>${
        r.enforcing === false ? ` <span class="tag dry">dry run</span>` : ""}</td>
    <td class="mono">${esc(r.summary)}${r.note ? `<div class="note" style="margin:2px 0 0">${esc(r.note)}</div>` : ""}</td>
    <td class="num">${fmt(r.hits)}</td>
    <td>${sparkline(r.hits_recent, bucket)}</td>
    <td class="num">${esc(r.last_hit ? ago(r.last_hit) : "—")}</td>
    <td class="num">${esc(until(r.expires_at))}</td>
    <td style="white-space:nowrap">
      ${ttlSelect(`data-ttl="${esc(r.id)}"`, undefined, "Change to…")}
      <button class="act" type="button" data-keep="${esc(r.id)}">Set</button>
      <button class="act danger" type="button" data-rule="${esc(r.id)}">Remove</button>
    </td>
  </tr>`).join("");
  const mins = Math.round(((d.guard || {}).hits_window_secs || 3600) / 60);
  el.innerHTML = `<table class="rules">
    <thead><tr><th>Action</th><th>Matches</th><th>Hits</th>
      <th>Last ${mins}m</th><th>Last</th><th>Expires</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="note">A rule reading <b>no hits</b> is costing a comparison on every request to
    the data plane and refusing nothing — either the attack stopped, or the match never described
    it. <b>Set</b> changes when a rule expires, including keeping it forever; the hit history
    carries over. Rules are never applied to this admin API, which is what keeps a bad one from
    locking you out of the page that removes it.</div>`;
}

function ruleOptions(alerts) {
  const sel = $("f-rule");
  const seen = [...new Set(alerts.map(a => a.rule))].sort();
  const want = `<option value="">Any rule</option>` +
    seen.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
  // Rebuilding unconditionally would drop the operator's selection mid-poll.
  if (sel.dataset.built !== seen.join(",")) {
    const current = sel.value;
    sel.innerHTML = want;
    sel.value = current;
    sel.dataset.built = seen.join(",");
  }
}

function query() {
  const p = new URLSearchParams();
  if ($("f-severity").value) p.set("severity", $("f-severity").value);
  if ($("f-rule").value) p.set("rule", $("f-rule").value);
  if ($("f-namespace").value) p.set("namespace", $("f-namespace").value);
  if ($("f-deployment").value.trim()) p.set("deployment", $("f-deployment").value.trim());
  const s = p.toString();
  return "/security" + (s ? "?" + s : "");
}

// The namespace options come from their own endpoint rather than from the
// alerts on screen: filtering by a namespace that currently has no findings is
// exactly the check somebody wants to be able to make, and a list built from
// the results could never offer it. Fetched once — namespaces are created by
// hand, not by traffic, and a reload picks up a new one.
async function namespaceOptions() {
  const r = await api("GET", "/namespaces");
  if (!r.ok) return;
  const sel = $("f-namespace");
  const names = (r.data || []).map(n => n.namespace);
  if (names.length < 2 && names[0] === "default") { sel.hidden = true; return; }
  const want = ['<option value="">Any namespace</option>']
    .concat(names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`)).join("");
  if (sel.dataset.built === want) return;
  const keep = sel.value;
  sel.dataset.built = want;
  sel.innerHTML = want;
  sel.value = keep;
}

async function load() {
  const r = await api("GET", query());
  if (!r.ok) {
    const why = r.status === 401 ? "Not authenticated."
      : r.status === 403 ? "This credential may not read the security console."
      : `GET /security failed (${r.status}).`;
    $("lede").textContent = why;
    return;
  }
  const d = r.data || {};
  latest = d;
  tiles(d);
  ruleOptions(d.alerts || []);
  renderAlerts(d);
  renderEnforcement(d);
  renderRules(d);

  const g = d.guard || {};
  const bits = [];
  bits.push(d.enabled
    ? `Watching authentication, attack signatures and traffic anomalies over a ${d.window_secs}s window.`
    : `Detection is off; enforcement is not.`);
  bits.push(`${fmt(g.rules)} rule${g.rules === 1 ? "" : "s"} in force.`);
  if (g.enforcing === false) bits.push("Enforcement is disabled — rules match but nothing is refused.");
  $("lede").textContent = bits.join(" ");
}

// --- acting ---------------------------------------------------------------

async function applyRule(spec, label) {
  // The last thing between a click and refused traffic. It shows the effect
  // sentence rather than "Are you sure?", because the sentence is the part that
  // decides whether this is the right button.
  const r = await api("POST", "/security/rules", spec);
  if (r.ok) {
    flash("ok", `${label} — rule ${r.data && r.data.id ? r.data.id : ""} is in force.`);
    await load();
    return;
  }
  const msg = r.data && (r.data.message || r.data.error) ? (r.data.message || r.data.error) : "";
  if (r.status === 401 || r.status === 403) {
    flash("bad", "Refused: this credential can read the console but not change what the data " +
      "plane does. Creating a rule needs admin credentials, not a view token.");
  } else {
    flash("bad", `Rule not created (${r.status}). ${msg}`);
  }
}

document.addEventListener("click", async ev => {
  const rm = ev.target.closest("button[data-rule]");
  if (rm) {
    const id = rm.getAttribute("data-rule");
    if (!confirm(`Remove rule ${id}? Traffic it was refusing will be served again.`)) return;
    rm.disabled = true;
    const r = await api("DELETE", "/security/rules/" + encodeURIComponent(id));
    if (r.ok) { flash("ok", `Rule ${id} removed.`); await load(); }
    else {
      rm.disabled = false;
      flash("bad", r.status === 401 || r.status === 403
        ? "Refused: removing a rule needs admin credentials."
        : `Rule not removed (${r.status}).`);
    }
    return;
  }

  const keep = ev.target.closest("button[data-keep]");
  if (keep) {
    const id = keep.getAttribute("data-keep");
    const sel = document.querySelector(`select[data-ttl="${CSS.escape(id)}"]`);
    const secs = sel ? ttlValue(sel) : undefined;
    if (secs === undefined) {
      flash("bad", "Pick a new lifetime from the dropdown first.");
      return;
    }
    const label = sel.options[sel.selectedIndex].text;
    if (secs === null && !confirm(
        `Keep rule ${id} forever?\n\nIt will outlive the incident that created it. ` +
        `A permanent block that nobody revisits is the usual way a mitigation ` +
        `turns into an outage months later.`)) return;
    keep.disabled = true;
    const r = await api("PATCH", "/security/rules/" + encodeURIComponent(id),
      { expires_in_secs: secs });
    if (r.ok) { flash("ok", `Rule ${id} now expires: ${label.toLowerCase()}.`); await load(); }
    else {
      keep.disabled = false;
      flash("bad", r.status === 401 || r.status === 403
        ? "Refused: changing a rule needs admin credentials."
        : `Rule not changed (${r.status}). ${(r.data && (r.data.message || r.data.error)) || ""}`);
    }
    return;
  }

  const btn = ev.target.closest("button[data-action]");
  if (!btn) return;
  const alertId = btn.getAttribute("data-alert");
  const idx = Number(btn.getAttribute("data-action"));
  const alert = (latest && latest.alerts || []).find(a => String(a.id) === alertId);
  const action = alert && alert.response && alert.response.actions[idx];
  if (!action) return;

  // The picker beside the button decides the lifetime, overriding whatever the
  // runbook suggested. Copied rather than mutated, so a failed POST does not
  // leave the cached alert carrying an edit that was never applied.
  const sel = document.querySelector(`select[data-for="${CSS.escape(alertId + "-" + idx)}"]`);
  const secs = sel ? ttlValue(sel) : (action.rule || {}).expires_in_secs;
  const rule = Object.assign({}, action.rule, { expires_in_secs: secs });
  const lifetime = secs === null || secs === undefined
    ? "It will not expire on its own."
    : `It expires in ${sel ? sel.options[sel.selectedIndex].text.toLowerCase() : secs + "s"}.`;
  if (!confirm(action.effect + "\n\n" + lifetime + "\n\nApply this rule?")) return;
  btn.disabled = true;
  await applyRule(rule, action.label);
  btn.disabled = false;
});

// Remember which runbooks are open across a poll.
document.addEventListener("toggle", ev => {
  const d = ev.target.closest("details.respond");
  if (!d) return;
  const id = Number(d.getAttribute("data-alert"));
  if (d.open) expanded.add(id); else expanded.delete(id);
}, true);

// --- polling --------------------------------------------------------------

let timer = null;
function schedule() {
  if (timer) clearInterval(timer);
  // Ten seconds, matching the dashboard's slow loop. Findings change on the
  // order of minutes; polling faster would only cost the operator their
  // scroll position more often.
  if ($("auto").checked) timer = setInterval(load, 10000);
}

["f-severity", "f-rule", "f-namespace", "f-deployment"].forEach(id =>
  $(id).addEventListener("change", load));
$("f-deployment").addEventListener("input", () => {
  clearTimeout($("f-deployment").debounce);
  $("f-deployment").debounce = setTimeout(load, 400);
});
$("refresh").addEventListener("click", load);
$("auto").addEventListener("change", schedule);
// The theme toggle lives in the shared script (/__ui/theme.js): it writes a
// cookie scoped to the parent domain, so the choice follows a person to every
// Heyo app instead of stopping at this origin.

namespaceOptions();
load();
schedule();
</script>
</body>
</html>

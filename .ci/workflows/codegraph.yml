# Build the `codegraph` release binary and upload it as an artifact.
#
# Submitted from the repository root, with an ordinary bundle:
#
#     git submit
#
# **No `--archive` here**, unlike the `heyo` monorepo. This repository's whole
# history bundles to 2.7 MB against a 64 MB `CI_MAX_SOURCE_BYTES`, so the
# default payload fits with room to spare. Two things follow, and both are why
# the default is worth keeping:
#
#  - `.git` exists in the guest, so the version stamp below is a real
#    `git describe` rather than a bare sha.
#  - **The `paths:` filter below actually filters.** `ci` reads a submit's diff
#    out of the bundle's own history; a tarball has none, and an unknown change
#    set matches every filter by design. With a bundle the set is real, so a
#    commit touching only `app-lb/` starts no run here at all — which is the
#    point of the filter in a repository with nine crates in it.
name: codegraph

on:
  submit:
    paths:
      # The crate. It has no path dependencies — `codegraph/Cargo.toml`
      # declares only registry crates — so unlike the other workspaces here
      # there is no sibling directory to list beside it.
      - 'codegraph/**'
      # This workflow and the image it builds in — named precisely rather than
      # as `.ci/**`, so adding a workflow for another crate here does not
      # rebuild this one.
      - '.ci/workflows/codegraph.yml'
      - '.ci/rust-cache.sh'
      - '.ci/image/codegraph/**'

jobs:
  release:
    # Any online host in the network the repository is assigned on /repos.
    # Deliberately not pinned: nothing here needs a particular machine, and
    # pinning would idle the build behind one host's queue. Add
    # `uses: <network>/<node>` if a specific runner is wanted.
    vm:
      driver: firecracker
      build:
        dockerfile: .ci/image/codegraph/Dockerfile
        # Defaulted to the Dockerfile's own directory, as `docker build -f`
        # does; spelled out because init.sh being in it is the point.
        context: .ci/image/codegraph
        # 6 GB, the same as the `ci` repository's own image and for the same
        # reason: what fills a rootfs is the Rust toolchain (~1 GB) plus a
        # CARGO_HOME registry that grows at runtime, and the toolchain is the
        # same size whatever the crate count. 109 crates' worth of registry is
        # noise beside it, so shrinking this would save disk on a runner host
        # and buy nothing but a narrower margin against the SIGBUS that a full
        # rootfs produces.
        size_mb: 6144
      # `medium`. 109 crates with four tree-sitter `parser.c` files is a
      # materially smaller build than the `large` this repository's servers
      # use, and the class is part of the pool fingerprint — asking for cores
      # nothing uses just makes the VM harder to place.
      size_class: medium
      # Mounted at /var/cache/ci by the image's init, which is where
      # CARGO_TARGET_DIR points — deliberately *not* /workspace, which `ci`
      # wipes on every checkout. This disk is what makes reusing a warm VM
      # worth anything.
      #
      # 10 GB against a measured 187 MB release target dir. The margin is not
      # generosity: cargo never garbage-collects a `target/`, so the number
      # that matters is how many reuses fit before init.sh's 85% guard wipes
      # it, and at this size that is a long time.
      disk_size_gb: 10
      # A dependency change is the one thing that must not reuse a warm VM: the
      # cached registry and target/ in it were resolved against the old
      # lockfile. Resolved against the repository root, so these are monorepo
      # paths.
      #
      # `rust-toolchain.toml` is listed although the crate has none — a missing
      # file hashes to an explicit marker, so adding one later busts the pool at
      # the moment it most needs busting. That matters more here than usual:
      # `codegraph` is edition 2024, so a pin would be a real constraint rather
      # than a formality.
      cache_key_files:
        - codegraph/Cargo.lock
        - codegraph/rust-toolchain.toml
    env:
      CARGO_TERM_COLOR: never
    # The job needs headroom over the sum of its steps. A cold build of 109
    # crates is minutes, not the hour a large workspace takes; a warm VM reuses
    # /var/cache/ci and relinks.
    timeout-minutes: 45
    steps:
      # The image's init runs the same guard, but only at boot — a warm VM
      # serves many runs between boots, and the disk fills *while* warm.
      # Without this a pooled VM that crosses the threshold mid-lifetime fails
      # every build with SIGBUS (rustc writes its output through mmap, and a
      # mapped page that cannot be backed on a full filesystem kills the
      # process) until the VM happens to be retired.
      #
      # It also refuses to build without the data disk at all. If /dev/vdb
      # never attached, /var/cache/ci sits on the 6 GB rootfs alongside the
      # toolchain and the registry, and a build that fills it dies with an
      # unreadable SIGBUS mid-compile. Failing here names the actual problem in
      # one line.
      - name: Guard the cache disk
        run: |
          df -P "$CARGO_TARGET_DIR" /
          if [ "$(stat -c %d "$CARGO_TARGET_DIR")" = "$(stat -c %d /)" ]; then
            echo "FATAL: $CARGO_TARGET_DIR is on the rootfs — the data disk (/dev/vdb) is not attached." >&2
            echo "Check disk creation on the runner host." >&2
            exit 1
          fi
          usage=$(df -P "$CARGO_TARGET_DIR" | awk 'NR==2 {gsub(/%/,""); print $5}')
          if [ -n "$usage" ] && [ "$usage" -ge 85 ]; then
            echo "cache disk at ${usage}%, wiping $CARGO_TARGET_DIR"
            rm -rf "$CARGO_TARGET_DIR"
          fi

      - name: Build
        # No `. "$HOME/.cargo/env"`: the image puts cargo on PATH through
        # /etc/profile.d, and the daemon runs every step as `sh -lc`, which is
        # a login shell and reads it.
        #
        # **Absolute, not `codegraph`.** Unlike GitHub, `ci` uses
        # `working-directory:` verbatim — it renders `cd <value> && …` and does
        # not join it onto the workspace — so a relative value is resolved from
        # the login shell's home directory and the step dies on `cd: no such
        # file`. /workspace is where the source is extracted.
        working-directory: /workspace/codegraph
        # `--locked` because the VM is fingerprinted on `Cargo.lock`: resolving
        # a different dependency set than the one the fingerprint was taken
        # from would make the warm VM's cache a claim that is not true.
        #
        # `--bin codegraph` rather than a bare `--release`: the crate is a lib
        # plus a bin, and only the bin ships. This also skips building
        # `tests/mcp.rs`, which is not what this workflow is for.
        #
        # `cargo fetch` first, then a df of both filesystems: the registry
        # lands in CARGO_HOME on the *rootfs*, which the guard step's check
        # deliberately does not fail on — so if the rootfs is what filled, the
        # line printed here is the one that says so, adjacent to the failure
        # rather than under a screen of compile output.
        #
        # On failure, the guest kernel's ring buffer is the one witness to
        # anything the kernel did to the build — an OOM kill, a block-layer I/O
        # error, an ext4 complaint, or a machine-check event injected from the
        # host (delivered to the mapping process as SIGBUS). rustc dying on a
        # signal looks identical from the outside in all four cases; this tail
        # is what tells them apart. Printing it here is safe — step output
        # rides the exec channel, not the serial console that carries the
        # marker protocol.
        env: &rust_cache_env
          CI_RUST_CACHE_MODE: ${{ vars.CI_RUST_CACHE_MODE }}
          SCCACHE_BUCKET: ${{ vars.CI_RUST_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ vars.CI_RUST_CACHE_ENDPOINT }}
          SCCACHE_REGION: ${{ vars.CI_RUST_CACHE_REGION }}
          SCCACHE_S3_KEY_PREFIX: ${{ vars.CI_RUST_CACHE_PREFIX }}
          CI_RUST_CACHE_ACCESS_KEY_ID: ${{ secrets.CI_RUST_CACHE_ACCESS_KEY_ID }}
          CI_RUST_CACHE_SECRET_ACCESS_KEY: ${{ secrets.CI_RUST_CACHE_SECRET_ACCESS_KEY }}
        run: |
          cargo fetch --locked
          df -P / "$CARGO_TARGET_DIR"
          if ! sh /workspace/.ci/rust-cache.sh cargo build --release --locked --bin codegraph; then
            echo "=== build failed; guest kernel log tail ==="
            dmesg | tail -100 || true
            df -P / "$CARGO_TARGET_DIR"
            exit 1
          fi

      # A binary that compiles and links can still fail to start — a missing
      # shared library, a panic in a lazy static, a tree-sitter grammar whose
      # ABI does not match the runtime it was built against. `--version` is the
      # cheapest command that proves the process comes up, and it is the one
      # thing an artifact consumer will do first.
      - name: Smoke-test the binary
        run: |
          "$CARGO_TARGET_DIR/release/codegraph" --version
          "$CARGO_TARGET_DIR/release/codegraph" --help > /dev/null

      # `ci/upload-artifact` tars its `path` relative to the *job's* working
      # directory — /workspace, the repository root — not the step's. And
      # CARGO_TARGET_DIR is outside the workspace entirely. So the binary is
      # brought back in rather than the uploader taught about absolute paths.
      #
      # Stripped: 9.3 MB unstripped against roughly half that after, and this
      # is a CLI people download rather than debug from a core dump. Drop
      # `strip` if that changes.
      - name: Collect the binary
        run: |
          set -eu
          mkdir -p dist
          src="$CARGO_TARGET_DIR/release/codegraph"
          [ -f "$src" ] || { echo "FATAL: codegraph was not built at $src" >&2; exit 1; }
          cp "$src" dist/codegraph
          strip dist/codegraph
          # A real `git describe`, which is available here only because this
          # repository submits as a bundle — the checkout clones it in the
          # guest, so /workspace is a repository with tags and history. A
          # `--archive` submit would have neither, which is why `ci.sha` is
          # recorded beside it rather than instead of it.
          describe="$(git -C /workspace describe --tags --always --dirty 2>/dev/null || echo 'no-git')"
          cat > dist/BUILD-INFO <<EOF
          version   $(dist/codegraph --version)
          describe  $describe
          commit    ${{ ci.sha }}
          branch    ${{ ci.branch }}
          run       ${{ ci.run_id }}
          EOF
          ( cd dist && sha256sum codegraph > SHA256SUMS )
          ls -la dist
          cat dist/BUILD-INFO

      # Lands in whichever sink the orchestrator is configured for — `disk`
      # (CI_ARTIFACT_DIR) by default, or the central `art serve` when
      # CI_ARTIFACT_SINK=artifacts. The workflow does not choose; it uploads.
      # Downloadable from the run page either way.
      # `description:` is what a person browsing the artifact store sees beside
      # the digest. Set as a *label* on the blob and the manifest rather than as
      # a manifest annotation — a manifest is addressed by its own hash, so
      # editing this line would otherwise fork the manifest for byte-identical
      # builds. Only the `artifacts` sink stores it; disk and S3 ignore it.
      - uses: ci/upload-artifact
        with:
          name: codegraph
          description: >-
            The codegraph CLI, a release binary for x86_64-linux, with
            SHA256SUMS. Built from ${{ ci.branch }}.
          path: dist
